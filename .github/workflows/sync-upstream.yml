name: Sync Upstream

on:
  schedule:
    # Запуск каждый день в 00:00 UTC
    - cron: '0 0 * * *'
  # Кнопка ручного запуска в Actions
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge changes from upstream
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          # Подключаем оригинальный репозиторий DeepSeek
          git remote add upstream https://github.com/deepseek-ai/deepseek-harness.git
          git fetch upstream master
          
          # Сливаем изменения из оригинала в ваш master
          git merge upstream/master --no-edit
          
          # Пушим обновленный результат
          git push origin master
